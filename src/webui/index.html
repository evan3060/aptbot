<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>aptbot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: rgb(255, 255, 255);
      --bg-warm: rgb(245, 242, 241);
      --bg-muted: rgb(249, 247, 244);
      --bg-dark: rgb(39, 36, 34);
      --bg-darker: rgb(18, 18, 18);
      --text-primary: rgb(39, 36, 34);
      --text-secondary: rgb(139, 133, 127);
      --accent: rgb(13, 113, 73);
      --decor-pink: rgb(241, 195, 214);
      --decor-red: rgb(254, 190, 191);
      --border: rgb(229, 231, 235);
      --surface-translucent: rgba(255, 255, 255, 0.98);
      --dark-translucent: rgba(39, 36, 34, 0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, "PingFang SC", sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      display: flex;
      flex-direction: row;
      height: 100vh;
      overflow: hidden;
    }

    /* §0.3.0 WebUI — 主布局：sidebar + main */
    #app-root {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100vh;
    }
    /* sidebar 区域 — Lit agent-sidebar 组件挂载点 */
    #sidebar-container {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
      overflow: hidden;
    }
    agent-sidebar {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* main 区域 — chips + messages + input + footer */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    header.app-header {
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header.app-header h1 { font-size: 16px; font-weight: 600; }
    #status {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      background: var(--bg-muted);
      color: var(--text-secondary);
    }
    #status.connected { background: rgba(13, 113, 73, 0.15); color: var(--accent); }
    #status.disconnected { background: rgba(254, 190, 191, 0.3); color: var(--text-primary); }

    skill-chips-bar {
      display: block;
      flex-shrink: 0;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    working-indicator, skill-chips-bar, input-box, footer-bar {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    memory-write-toast, agent-settings-modal, new-agent-modal {
      position: fixed;
      z-index: 1000;
    }

    .hidden { display: none !important; }

    /* auth modal — vanilla JS 控制（与 0.2.x chat-page 兼容） */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--dark-translucent);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-content {
      background: var(--bg-base);
      border-radius: 8px;
      padding: 24px;
      width: 360px;
      max-width: 90vw;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }
    .modal-content h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .modal-content .form-group {
      margin-bottom: 12px;
    }
    .modal-content label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .modal-content input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }
    .modal-content input:focus {
      border-color: var(--accent);
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .modal-content .submit-btn {
      width: 100%;
      padding: 9px;
      background: var(--accent);
      color: var(--bg-base);
      border: none;
      border-radius: 9999px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 4px;
    }
    .modal-content .submit-btn:hover { background: rgb(10, 95, 60); }
    .modal-content .submit-btn:disabled { background: var(--text-secondary); cursor: not-allowed; }
    .modal-content .switch-link {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .modal-content .switch-link a {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
    }
    #auth-error {
      color: var(--text-primary);
      background: rgba(254, 190, 191, 0.3);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      margin-bottom: 8px;
      display: none;
    }
    #auth-error.show { display: block; }

    /* 移动端 sidebar 抽屉化 */
    #sidebar-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 8px;
      color: var(--text-primary);
      align-self: center;
      border-radius: 6px;
      -webkit-tap-highlight-color: transparent;
      line-height: 0;
    }
    #sidebar-toggle:hover { background: var(--bg-muted); }
    #sidebar-toggle svg { display: block; width: 20px; height: 20px; }
    #sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(18, 18, 18, 0.45);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 90;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #sidebar-backdrop.show { display: block; opacity: 1; }
    @media (max-width: 768px) {
      #sidebar-toggle { display: inline-flex; align-items: center; justify-content: center; }
      #sidebar-container {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 280px;
        max-width: 85vw;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 100;
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.18);
      }
      #sidebar-container.open { transform: translateX(0); }
      #main { width: 100%; }
      #messages { padding: 12px; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div id="app-root">
    <!-- §0.3.0 Task 13: agent 树形 sidebar（Lit 组件） -->
    <div id="sidebar-container">
      <agent-sidebar></agent-sidebar>
    </div>
    <div id="sidebar-backdrop"></div>

    <div id="main">
      <header class="app-header">
        <button id="sidebar-toggle" aria-label="会话列表">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="7" x2="20" y2="7"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="17" x2="20" y2="17"/>
          </svg>
        </button>
        <h1>aptbot</h1>
        <span id="status">connecting...</span>
      </header>

      <!-- §0.3.0 Task 15: skill chip 区（Lit 组件，仅 default agent 显示） -->
      <skill-chips-bar></skill-chips-bar>

      <div id="messages"></div>
      <working-indicator></working-indicator>
      <input-box></input-box>
      <footer-bar></footer-bar>
    </div>
  </div>

  <!-- §0.3.0 Task 14/16: 浮层组件（Lit 组件，按需显示） -->
  <!-- §0.3.0 WebUI 集成修复: 移除 class="hidden" — Lit 组件通过 open 属性控制显示，
       全局 .hidden { display: none !important } 会阻止 modal 即使 open=true 也无法显示 -->
  <memory-write-toast></memory-write-toast>
  <agent-settings-modal></agent-settings-modal>
  <new-agent-modal></new-agent-modal>

  <!-- Auth modal — vanilla JS 控制（与 0.2.x 一致，从 chat-page.ts 迁移） -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div id="auth-error"></div>
      <form id="login-form">
        <h2>登录</h2>
        <div class="form-group">
          <label for="login-username">用户名</label>
          <input id="login-username" type="text" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="login-password">密码</label>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="submit-btn">登录</button>
        <div class="switch-link">还没有账号？<a id="to-register">注册</a></div>
      </form>
      <form id="register-form" class="hidden">
        <h2>注册</h2>
        <div class="form-group">
          <label for="reg-username">用户名</label>
          <input id="reg-username" type="text" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="reg-password">密码</label>
          <input id="reg-password" type="password" autocomplete="new-password" required />
        </div>
        <div class="form-group">
          <label for="reg-password2">确认密码</label>
          <input id="reg-password2" type="password" autocomplete="new-password" required />
        </div>
        <button type="submit" class="submit-btn">注册</button>
        <div class="switch-link">已有账号？<a id="to-login">登录</a></div>
      </form>
    </div>
  </div>

  <!-- §0.3.0 WebUI bundle — esbuild 打包后的 ESM 入口 -->
  <script type="module" src="/webui/index.js"></script>
</body>
</html>
